connectors:
  SENSOR:
    pincount: 3
    type: Hall sensor
    pinlabels: [5V, GND, SIG]
  J-THR-A:
    pincount: 3
    type: Deutsch DT03 (male)
  J-THR-B:
    pincount: 3
    type: Deutsch DT03 (female)
  BMS:
    pincount: 3
    type: Battery management system
    pinlabels: [GND, RX, TX]
  J-BMS-A:
    pincount: 3
    type: Deutsch DT03 (female)
  J-BMS-B:
    pincount: 3
    type: Deutsch DT03 (male)
  VESC:
    pincount: 3
    type: Variable electric speed controller
    pinlabels: [CANH, CANL, GND]
  J-VESC-A:
    pincount: 4
    type: Deutsch DT03 (male)
  J-VESC-B:
    pincount: 4
    type: Deutsch DT03 (female)
  CAN-MODULE:
    pincount: 7
    type: Isolated CAN Transceiver
    pinlabels: [CANH, CANL, CANGND, 5V, T, R, GND]
  VCU:
    pincount: 7
    type: VCU board
    pinlabels: [5V, GND, THROTTLE_ADC, BMS_TX, BMS_RX, CAN_RX, CAN_TX]

cables:
  W-SENSOR:
    colors: [RD, BK, GN]
    length: 0.3
  W-SENSOR-VCU:
    colors: [RD, BK, GN]
    length: 0.3
  W-BMS:
    colors: [BK, WH, BU]
    length: 0.3
  W-BMS-VCU:
    colors: [BK, WH, BU]
    length: 0.3
  W-VESC:
    colors: [YE, GN, BK]
    length: 0.3
  W-VESC-MOD:
    colors: [YE, GN, BK]
    length: 0.3
  W-VESC-MOD-VCU:
    colors: [RD, WH, BU, BK]
    length: 0.3

connections:
  - - SENSOR: [1, 2, 3]
    - W-SENSOR: [1, 2, 3]
    - J-THR-A: [1, 2, 3]
    - "-->"
    - J-THR-B: [1, 2, 3]
    - W-SENSOR-VCU: [1, 2, 3]
    - VCU: [1, 2, 3]
  - - BMS: [1, 2, 3]
    - W-BMS: [1, 2, 3]
    - J-BMS-A: [1, 2, 3]
    - "-->"
    - J-BMS-B: [1, 2, 3]
    - W-BMS-VCU: [1, 2, 3]
    - VCU: [2, 4, 5]
  - - VESC: [1, 2, 3]
    - W-VESC: [1, 2, 3]
    - J-VESC-A: [1, 2, 3]
    - "-->"
    - J-VESC-B: [1, 2, 3]
    - W-VESC-MOD: [1, 2, 3]
    - CAN-MODULE: [1, 2, 3]
  - - CAN-MODULE: [4, 5, 6, 7]
    - W-VESC-MOD-VCU: [1, 2, 3, 4]
    - VCU: [1, 6, 7, 2]